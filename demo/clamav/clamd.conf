# A micro ClamAV for the demo. It only loads demo.ndb next to this file, so it
# needs a few MB instead of the full signature database and starts at once.
# It shows how a share with a malicious file is caught, nothing more.
DatabaseDirectory /opt/demo/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
Foreground yes
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
# a share holds 1 MB at most
StreamMaxLength 2M
MaxFileSize 2M
MaxScanSize 2M
