# Settings of the public demo. db.mjs writes them into the database, so the
# admin pages look like those of any instance, and DEMO_MODE refuses to save
# a change. __APP_URL__ and __DEMO_ADMIN_PASSWORD__ are filled in at every
# reset.
general:
  appName: Pingvin Share Vault Demo
  appUrl: __APP_URL__
  showHomePage: "true"
  showAuthButtons: "true"
security:
  secureCookies: "true"
  enableEmailVerification: "false"
  # visitors use the demo account or share without one
  allowRegistration: "false"
  allowUnauthenticatedShares: "true"
  allowAdminAccessAllShares: "false"
share:
  # 1 MiB per share, the demo is for trying things out, not for hosting
  maxSize: "1048576"
  maxExpiration: "0 days"
  defaultExpiration: "1 days"
  enableShareEmailRecipients: "false"
  enableShareDownloadNotifications: "false"
  enableUserRecipients: "false"
  zipCompressionLevel: "1"
  downloadAll: zip-on-the-fly
  fileRetentionPeriod: "0 days"
smtp:
  enabled: "false"
ldap:
  enabled: "false"
oauth:
  allowRegistration: "false"
  github-enabled: "false"
  google-enabled: "false"
  microsoft-enabled: "false"
  discord-enabled: "false"
  oidc-enabled: "false"
s3:
  enabled: "false"
appearance:
  # the demo shows off the glass style, every visitor can switch back on the
  # account page
  uiStyle: glass
  # the built in Alps wallpaper; uploading your own is closed in the demo
  glassBackground: image
  glassBackgroundUrl: /wallpapers/alps.webp
  customCss: |
    body::before {
      content: "Demo: everything is reset every 15 minutes. Admin: demoadmin / __DEMO_ADMIN_PASSWORD__ (new at every reset). User: demo / demo1234. Or share without an account. Max 1 MB per share. Upload the EICAR test file to see the virus scan.";
      display: block;
      padding: 6px 12px;
      text-align: center;
      font-size: 13px;
      background: #fff3bf;
      color: #5c3c00;
    }
